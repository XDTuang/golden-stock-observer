name: Touzid Weekly - Institutional Flow (股东户数周更)

# 股东户数为季度报告期数据（东财 gdhs），无需每日更新。
# 每周日 21:00 北京时间（13:00 UTC）刷新一次，覆盖新报告期发布即可。
on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:   # 手动触发按钮

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      # 🔴 2026-11-25：密钥必须在作业环境里，供 ci_restage.sh 的 --sync-root / --verify-key 使用
      DDB_DATA_KEY: ${{ secrets.DDB_DATA_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        run: pip install akshare pandas requests cryptography --quiet && python -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: Fetch institutional flow (quarterly report periods)
        run: |
          python fetch_touzid_data.py --inst-only || echo "fetch returned nonzero, continue"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 🔴 逐个判存在：产物缺失时裸 `git add -f` 会 pathspec fatal（见 realtime #1229）
          for f in output/institutional_flow.json deploy/output/institutional_flow.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          if ! git diff --cached --quiet; then
            python tool/protect_assets.py --encrypt --purge
            bash tool/ci_restage.sh
            git commit -m "touzid: 股东户数周更 $(date +%F)"
            # 防冲突：本机兜底/其它 workflow 并发提交时避免 push 失败
            for i in 1 2 3; do
              if git pull --rebase origin main; then break; fi
              echo "⚠️ rebase 失败（第 $i 次），abort 后退避重试"
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
            git push
          else
            echo "no changes (institutional_flow.json unchanged)"
          fi
