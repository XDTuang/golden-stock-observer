name: Daily Review Market Update

on:
  schedule:
    # 每交易日 08:15 北京时间 = 00:15 UTC（周一~五）
    # 数据窗口: T-1 A股收盘 + 隔夜美股收盘 + T-1 日韩（日韩在云端不稳定，由本机补充）
    - cron: '15 0 * * 1-5'
  workflow_dispatch:   # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        run: pip install akshare pandas requests --quiet   # us_kline(双日)/comm(商品利率) 依赖 akshare

      - name: Fetch daily review market quotes (Tencent public API, no key)
        # 主行情脚本：不用 || echo 吞错误码 —— fetch 失败必须让 workflow 标红，
        # 避免"假成功 + 静默跳过提交"。
        run: |
          python3 review/fetch_daily_review_market.py
          # 三星/海力士收盘价：辅助数据源，失败不阻断主流程。
          # 2026-08-28 事故：fengle_kr.py 因数据源 compareToPreviousClosePrice 缺失
          # 导致 chg=None，`{None:+,}` 抛 TypeError 崩溃 → 本步骤失败 →
          # 整个 workflow 连续两天 failure，market.json 停更（脚本已修 None 安全）。
          # 此处再加一层容错，确保辅助源异常不影响主行情提交。
          python3 review/fengle_kr.py || echo "⚠️ 韩股(三星/海力士)抓取失败，已跳过（不影响主行情）"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 🔴 2026-09-02 三次修复：去掉 stash 机制，改「先 add+commit → rebase → push」。
          #   12:25 schedule run（已含 fbeb15a 的 git add -f -u 修复）仍失败在 Commit & Push，
          #   stash 机制是最大疑点（无法取日志，逻辑审计）：
          #   ① fetch 无新数据时 `git stash push` 只保存空 stash → 下方 `git stash pop`
          #      报 "No stash entries found" → exit 1 → **数据无变化也标红**；
          #   ② 远端并发提交数据文件时 stash pop 必冲突 → exit 1。
          #   ③ stash pop 失败后产物仍藏在 stash 里，数据丢失且下次调度叠加。
          #   新逻辑（无 stash，全流程幂等）：
          #     先 git add 全量 fetch 产物（含 deploy 副本）→ commit（工作区自此干净）→
          #     rebase 循环（无未提交改动可挡，不会重现 8/31 的 unstaged changes 挂点）→
          #     push（基线=远端最新，fast-forward 必然成功）。
          #   add 兜底用 `git add -f -u`：只处理已 tracked 文件，遇 .gitignore 的
          #   untracked 新文件不报错（09:17 那次 git add -A 被 ignore 挡死 exit 1 的教训）。
          #   「no changes」分支显式 exit 0 → 数据无变化时步骤绿（修掉 ①）。
          git add data/daily_review/market.json deploy/data/daily_review/market.json \
                  data/daily_review/analysis.html output/kr_stocks.json deploy/output/kr_stocks.json
          git add -f -u
          if git diff --cached --quiet; then
            echo "no changes (market.json unchanged)"
            exit 0
          fi
          git commit -m "daily-review: update market quotes + 三星/海力士收盘 $(date +%F)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main; then break; fi
            echo "⚠️ rebase 失败（第 $i 次），abort 后退避重试"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          git push || { echo "❌ push 被拒，下次调度会自愈重试"; exit 1; }
          echo "✅ push 成功"
