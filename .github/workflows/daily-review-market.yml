name: Daily Review Market Update

on:
  schedule:
    # 每交易日 08:15 北京时间 = 00:15 UTC（周一~五）
    # 数据窗口: T-1 A股收盘 + 隔夜美股收盘 + T-1 日韩（日韩在云端不稳定，由本机补充）
    - cron: '15 0 * * 1-5'
  workflow_dispatch:   # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        run: pip install akshare pandas requests --quiet   # us_kline(双日)/comm(商品利率) 依赖 akshare

      - name: Fetch daily review market quotes (Tencent public API, no key)
        # 主行情脚本：不用 || echo 吞错误码 —— fetch 失败必须让 workflow 标红，
        # 避免"假成功 + 静默跳过提交"。
        run: |
          python3 review/fetch_daily_review_market.py
          # 三星/海力士收盘价：辅助数据源，失败不阻断主流程。
          # 2026-08-28 事故：fengle_kr.py 因数据源 compareToPreviousClosePrice 缺失
          # 导致 chg=None，`{None:+,}` 抛 TypeError 崩溃 → 本步骤失败 →
          # 整个 workflow 连续两天 failure，market.json 停更（脚本已修 None 安全）。
          # 此处再加一层容错，确保辅助源异常不影响主行情提交。
          python3 review/fengle_kr.py || echo "⚠️ 韩股(三星/海力士)抓取失败，已跳过（不影响主行情）"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 🔴 2026-09-01 二次修复：改为「先拉平远端，再 commit，后 push」的治本顺序。
          #   旧顺序「先 commit 后 rebase」有两个致命点：
          #   ① fetch 产物是未提交改动，`git pull --rebase` 遇到 unstaged changes 直接失败
          #      （cannot pull with rebase: You have unstaged changes）——8/31 曾因此连挂 3 天；
          #   ② for 循环 rebase 3 次后无成功判断直接 push，rebase 全败时 push 必被拒 → 步骤红
          #      ——9/1 13:01 实测仍 failure（Commit & Push 步骤），连续 4 天失败根因即此。
          #   新逻辑：stash 藏起 fetch 产物 → 循环拉平远端（重试 5 次）→ stash pop 恢复
          #   → commit → push（此时基线=远端最新，push 必然 fast-forward）。
          git stash push --include-untracked -m "market-update-$(date +%H%M)" 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main; then break; fi
            echo "⚠️ rebase 失败（第 $i 次），abort 后退避重试"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          # 恢复 fetch 产物；若 pop 冲突（数据文件与远端并发修改），明确标红而非静默吞掉
          git stash pop 2>/dev/null || { echo "❌ stash pop 冲突，请手动解决：git stash list"; exit 1; }
          # 明确 add 列表 + 兜底强加：daily-review-market 维护 deploy/ + output/ 副本，
          # 但 .gitignore 第 32 行写了 `deploy/`，普通 `git add -A` 对未被 -f 单独 track 过的
          # deploy/output 下新文件会 ignore 跳过 + 返回非 0 exit code → 整个 step 红。
          # 9/2 09:17/09:24 两次 workflow_dispatch run 死在这一步（截图错误：
          # "The following paths are ignored by one of your .gitignore files: deploy, output"）。
          # 修复：用 `git add -f -u` 兜底（-u 只更新已 tracked 文件，-f 强加 .gitignore 阻挡的 tracked 文件），
          # 既不引入 untracked 临时文件，又保证 deploy/output 副本 100% push 上去。
          git add data/daily_review/market.json deploy/data/daily_review/market.json \
                  data/daily_review/analysis.html output/kr_stocks.json deploy/output/kr_stocks.json
          git add -f -u  # 🔴 2026-09-02 修复：去掉 -A 改 -f -u（防 gitignore 阻挡 + 不引入临时文件）
          if ! git diff --cached --quiet; then
            git commit -m "daily-review: update market quotes + 三星/海力士收盘 $(date +%F)"
            git push || { echo "❌ push 被拒，下次调度会自愈重试"; exit 1; }
            echo "✅ push 成功"
          else
            echo "no changes (market.json unchanged)"
          fi
