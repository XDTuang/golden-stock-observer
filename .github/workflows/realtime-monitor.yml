name: 实时盯盘盘中更新
on:
  schedule:
    # ── 云端主力：A股交易日 8 个时间点自动刷新（UTC = 北京 - 8h）──
    # ⚠️ 2026-09-01 事故：原用整点/半点 '30 1-6' + '0 2-7'，
    #   实测 9/1 开盘后一次都没触发（8/31 16:02 之后零运行）。
    #   根因：GitHub Actions 在整点/半点是全球高峰，排队后被丢弃或延迟数小时；
    #   延迟到收盘后才补跑时脚本已判定"非盘中" → 直接跳过 → 全天无数据。
    # 对策：分钟位统一取 15/45，避开整点与半点高峰（GitHub 官方建议）。
    #
    # 北京 09:45 / 10:15 / 10:45 / 11:15 / 13:15 / 13:45 / 14:15 / 14:45（用户 2026-09-01 指定）
    - cron: '45 1 * * 1-5'   # 北京 09:45（上午首档）
    - cron: '15 2 * * 1-5'   # 北京 10:15
    - cron: '45 2 * * 1-5'   # 北京 10:45
    - cron: '15 3 * * 1-5'   # 北京 11:15（午休前最后一档）
    - cron: '15 5 * * 1-5'   # 北京 13:15（午休后首档）
    - cron: '45 5 * * 1-5'   # 北京 13:45
    - cron: '15 6 * * 1-5'   # 北京 14:15
    - cron: '45 6 * * 1-5'   # 北京 14:45（收盘前最后一档）
    #
    # ── 职责边界（勿与本地兜底混淆）──────────────────────────────────
    #   云端主力 = 本文件，每交易日 8 个时间点（上列）。
    #   本地兜底 = ~/Library/LaunchAgents/com.goldenstock.realtime.plist，
    #              严格**一天仅 2 次**（北京 10:30 / 14:30），
    #              且 realtime_local_fallback.sh 内先做云端健康检查
    #              （云端当日已成功 → 直接 exit 0，不重复抓取推送）。
    #   11:30-13:00 午休不排档，由 fetch_realtime.py 内部状态机拦截。
    #   周末/法定节假日由脚本内交易日历拦截。
  workflow_dispatch:  # 手动触发按钮（用于首次测试 / 补刷）

concurrency:
  group: realtime-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  realtime:
    runs-on: ubuntu-latest
    # 全市场分页(25页×15s超时)最坏 ~6.3 分钟 + 指数/板块/ETF + runner 冷启动；
    # 原 10 分钟太紧，接口延迟波动时 run 被中途杀掉、realtime.json 漏更新。
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: 抓取实时数据并计算五层信号
        run: |
          python fetch_realtime.py --out realtime.json

      - name: 提交并推送（数据有变化才推）
        run: |
          if [ ! -f realtime.json ]; then
            echo "ℹ️ 非盘中时段（未开盘/午休/收盘/非交易日），脚本未产出新数据，跳过推送"
            exit 0
          fi
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # 2026-09-01：同步 deploy 副本。
          # 本地预览根目录是 deploy/（不是项目根），若只 add 不 cp → 本地预览永远看不到更新。
          # 实测：13:15 触发成功后线上已 13:15:30，但 deploy/realtime.json 还是 10:05（陈旧 3 小时）。
          cp -f realtime.json deploy/realtime.json 2>/dev/null || true
          git add -f realtime.json
          [ -f deploy/realtime.json ] && git add -f deploy/realtime.json || true
          if git diff --cached --quiet; then
            echo "ℹ️ 数据无变化，跳过推送"
          else
            git commit -m "实时盯盘数据: $(date '+%Y-%m-%d %H:%M')"
            # 防冲突：本机兜底/其它 workflow 并发提交。
            # ⚠️ 原写法 `git pull --rebase origin main || true` 会把 rebase 失败静默吞掉，
            #    带着未同步的工作区直接 push → non-fast-forward 被拒 → 静默失败零告警
            #    （8/31 Daily Golden Stock Update 连续 3 次就是这样挂的）。
            #    改为：失败则 abort + 退避重试，最多 3 次。
            for i in 1 2 3; do
              if git pull --rebase origin main; then break; fi
              echo "⚠️ rebase 失败（第 $i 次），abort 后退避重试"
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
            git push origin main
            echo "✅ 已推送 realtime.json"
          fi
