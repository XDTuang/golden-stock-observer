name: 实时盯盘盘中更新
on:
  schedule:
    # ── 2026-09-04 实验：8 档精简为 4 档（排队量减半，验证延迟是否改善）──
    # 🔴 9/4 排查实测（9/1-9/3 三天）：8 档其实**全部触发**（每天 8 条 run），
    #   但 GitHub 队列积压导致延迟 20~314 分钟，仅 UTC 06:15 档（北京 14:15）
    #   延迟 10-14 分钟能落在盘中；其余 7 档全部落到北京 15:00 收盘后 →
    #   fetch_realtime.py 判"非盘中"不写文件 → 当天云端盘中数据为 0。
    #   原 09:45/10:45/13:45/14:45 四档已删除（9/4 起）。
    # 假设：减少 schedule 排队量 → 延迟降低。保留上下午各 2 档 + 最可靠档作对照。
    # 观测窗口：9/4 下午（13:15/14:15）+ 9/7 周一全天。
    #   若延迟仍 >30 分钟 → 切换外部触发器方案（workflow_dispatch，见 gh_dispatch_trigger/README.md），
    #   届时此 schedule 段减至 1 档（14:15）作兜底。
    #
    # 北京 10:15 / 11:15 / 13:15 / 14:15（UTC 02:15 / 03:15 / 05:15 / 06:15）
    - cron: '15 2 * * 1-5'   # 北京 10:15
    - cron: '15 3 * * 1-5'   # 北京 11:15（午休前最后一档）
    - cron: '15 5 * * 1-5'   # 北京 13:15（午休后首档）
    - cron: '15 6 * * 1-5'   # 北京 14:15（实测最可靠档，保留作对照基准）
    #
    # ── 职责边界（勿与本地兜底混淆）──────────────────────────────────
    #   云端主力 = 本文件（实验期 4 档；外部触发器方案上线后减至 1 档兜底）。
    #   本地兜底 = ~/Library/LaunchAgents/com.goldenstock.realtime.plist + WorkBuddy automation，
    #              严格**一天仅 2 次**（北京 10:30 / 14:15），
    #              且 realtime_local_fallback.sh 内先做云端健康检查
    #              （云端当日已成功 → 直接 exit 0，不重复抓取推送）。
    #   11:30-13:00 午休不排档，由 fetch_realtime.py 内部状态机拦截。
    #   周末/法定节假日由脚本内交易日历拦截。
  workflow_dispatch:  # 手动触发按钮（用于首次测试 / 补刷）

concurrency:
  group: realtime-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  realtime:
    runs-on: ubuntu-latest
    # 全市场分页(25页×15s超时)最坏 ~6.3 分钟 + 指数/板块/ETF + runner 冷启动；
    # 原 10 分钟太紧，接口延迟波动时 run 被中途杀掉、realtime.json 漏更新。
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: 抓取实时数据并计算五层信号
        run: |
          python fetch_realtime.py --out realtime.json

      - name: 提交并推送（数据有变化才推）
        run: |
          if [ ! -f realtime.json ]; then
            echo "ℹ️ 非盘中时段（未开盘/午休/收盘/非交易日），脚本未产出新数据，跳过推送"
            exit 0
          fi
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # 2026-09-01：同步 deploy 副本。
          # 本地预览根目录是 deploy/（不是项目根），若只 add 不 cp → 本地预览永远看不到更新。
          # 实测：13:15 触发成功后线上已 13:15:30，但 deploy/realtime.json 还是 10:05（陈旧 3 小时）。
          cp -f realtime.json deploy/realtime.json 2>/dev/null || true
          git add -f realtime.json
          [ -f deploy/realtime.json ] && git add -f deploy/realtime.json || true
          if git diff --cached --quiet; then
            echo "ℹ️ 数据无变化，跳过推送"
          else
            git commit -m "实时盯盘数据: $(date '+%Y-%m-%d %H:%M')"
            # 防冲突：本机兜底/其它 workflow 并发提交。
            # ⚠️ 原写法 `git pull --rebase origin main || true` 会把 rebase 失败静默吞掉，
            #    带着未同步的工作区直接 push → non-fast-forward 被拒 → 静默失败零告警
            #    （8/31 Daily Golden Stock Update 连续 3 次就是这样挂的）。
            #    改为：失败则 abort + 退避重试，最多 3 次。
            for i in 1 2 3; do
              if git pull --rebase origin main; then break; fi
              echo "⚠️ rebase 失败（第 $i 次），abort 后退避重试"
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
            git push origin main
            echo "✅ 已推送 realtime.json"
          fi
