name: Daily Golden Stock Update
on:
  schedule:
    # 每交易日 16:35 北京时间 = 08:35 UTC（周一~五）
    - cron: '35 8 * * 1-5'
  workflow_dispatch:  # 手动触发按钮（用于首次测试）

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 最多3小时
    permissions:
      contents: write   # 允许 git push

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Verify API Reachability
        run: |
          echo "K线接口:" && curl -sL -o /dev/null -w "%{http_code}" "https://proxy.finance.qq.com/ifzqgtimg/appstock/app/fqkline/get?p=1&param=sh600519,day,,,5,qfq"
          echo ""
          echo "成交额接口:" && curl -sL -o /dev/null -w "%{http_code}" "https://qt.gtimg.cn/q=sh600519,sz000858"
          echo ""

      - name: Restore Kline Cache
        uses: actions/cache@v4
        id: kline-cache
        with:
          path: output/kline_raw.json
          key: kline-raw-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kline-raw-${{ runner.os }}-

      - name: Run Full Update Pipeline
        id: update
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # 闸门判断（交易日+已收盘）
          GUARD=$(python -c "from market_calendar import should_update_now; ok,reason=should_update_now(); print(('OK' if ok else 'SKIP')+':'+reason)")
          echo "闸门: $GUARD"
          if [[ "$GUARD" != OK:* ]]; then
            echo "SKIP_REASON=$GUARD" >> $GITHUB_ENV
            echo "跳过：非交易日或盘中"
            exit 0
          fi
          # 运行完整数据管线
          bash update_data.sh

      - name: Sync Deploy to Root and Push
        if: success()
        run: |
          set -e
          # 同步 slim 产出的 deploy/ 到仓库根目录（与 github_pages_deploy.sh Step 3 一致）
          DEPLOY="deploy"
          cp "$DEPLOY/index.html" index.html
          cp "$DEPLOY/signals.json" signals.json
          cp "$DEPLOY/lh_calendar.json" lh_calendar.json 2>/dev/null || true
          cp "$DEPLOY/build_manifest.json" build_manifest.json 2>/dev/null || true
          rm -rf output
          cp -R "$DEPLOY/output" output
          touch .nojekyll

          git add -A
          git add -f index.html signals.json .nojekyll \
            output/top10_history.json output/sector_flow.json output/national_team_etf.json \
            output/golden_diamond.json output/golden_diamond_history.json output/sector_golden_diamond_history.json \
            output/observation_pool.json output/gate_data.json \
            output/golden_pool_*.json output/golden_pool_meta.json output/golden_pool_manifest.json \
            output/stocks.json \
            output/sh_index_kline.json output/sz_index_kline.json output/cyb_index_kline.json \
            output/kc50_index_kline.json output/hs300_index_kline.json

          if git diff --cached --quiet; then
            echo "无更改，跳过推送"
          else
            git commit -m "数据更新: $(date '+%Y-%m-%d %H:%M') (GitHub Actions)"
            git push origin main
            echo "✅ 主站已推送"
          fi

      - name: Deploy CloudBase
        if: success()
        env:
          CLOUDBASE_ENV_ID: golden-diamond-observer-d805c7e7
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: |
          npm install -g @cloudbase/cli
          if [ -n "$CLOUDBASE_API_KEY" ]; then
            tcb login --cloudbase-api-key "$CLOUDBASE_API_KEY" -e "$CLOUDBASE_ENV_ID"
            bash cloudbase/deploy_cloudbase.sh
          else
            echo "⚠️ CLOUDBASE_API_KEY 未配置，跳过 CloudBase"
          fi
