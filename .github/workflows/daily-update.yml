name: Daily Golden Stock Update
on:
  schedule:
    # ── 主触发 + 冗余补触发（抗 GitHub schedule 丢事件）──
    # 背景：2026-08-29~08-31 期间，本 workflow 的每日单次 schedule 被 GitHub 连续丢弃
    # （8/26 延迟32分 → 8/27 延迟10h → 8/28 延迟11h → 8/29起零触发），
    # 而同仓库每半小时的实时盯盘 workflow 同期仍正常触发。
    # 对策：铺多个时间点，任一命中即可；重复命中由「幂等闸门」自动跳过，不浪费配额。
    #   UTC 09:45 = 北京 17:45（主，收盘后龙虎榜已出）
    #   UTC 10:45 = 北京 18:45（补）
    #   UTC 12:45 = 北京 20:45（补）
    #   UTC 14:45 = 北京 22:45（末次兜底，覆盖前三次全被丢弃的极端情况）
    - cron: '45 9 * * 1-5'
    - cron: '45 10 * * 1-5'
    - cron: '45 12 * * 1-5'
    - cron: '45 14 * * 1-5'
  workflow_dispatch:  # 手动触发按钮（用于首次测试 / 紧急补跑）

concurrency:
  group: daily-update
  cancel-in-progress: false   # 不取消进行中的 run，避免跑到一半被中断推半成品

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 实测 15~47 分钟；原 360 过长会占用队列、降低本 workflow 调度优先级
    permissions:
      contents: write   # 允许 git push

    # ⚠️ market_calendar.py 用 datetime.now() 假定本地 Asia/Shanghai
    # runner 是 UTC，必须设 TZ 才能让交易日+收盘判断正确
    # 云端 LIMIT=800（与本机一致，金钻票池不漏扫联创光电等）
    env:
      TZ: Asia/Shanghai
      PYTHON: python
      LIMIT: '800'
      # 研报数据源（知识星球 api.zsxq.com）。在仓库 Settings→Secrets 配置 ZSXQ_ACCESS_TOKEN。
      # 未配置时 report_analysis.py 会保留本机已推的研报数据、不覆盖、不中断主流程。
      ZSXQ_ACCESS_TOKEN: ${{ secrets.ZSXQ_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install pandas numpy requests akshare

      # 冗余 cron 会一日多次触发；若今日数据已落库则直接跳过，避免重复消耗配额/分钟数
      - name: 幂等闸门（今日已完成则跳过）
        id: gate
        run: |
          TODAY=$(date +%F)
          LATEST=$(python3 - <<'PY' || true
          import json
          try:
              d=json.load(open('signals.json',encoding='utf-8'))
              print(d.get('freshness',{}).get('latest_data_date','') or '')
          except Exception:
              print('')
          PY
          )
          echo "今日=$TODAY  仓库已落库最新数据日期=$LATEST"
          if [ "$LATEST" = "$TODAY" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 今日数据已更新 → 跳过本次运行（节省 Actions 配额）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "▶️ 需要更新（或为手动强制触发）"
          fi

      - name: Verify API Reachability
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "K线接口:" && curl -sL -o /dev/null -w "%{http_code}" "https://proxy.finance.qq.com/ifzqgtimg/appstock/app/fqkline/get?p=1&param=sh600519,day,,,5,qfq"
          echo ""
          echo "成交额接口:" && curl -sL -o /dev/null -w "%{http_code}" "https://qt.gtimg.cn/q=sh600519,sz000858"
          echo ""
          echo "时区确认:"
          date '+%Z %Y-%m-%d %H:%M:%S'

      - name: Restore Kline Cache
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        id: kline-cache
        with:
          path: output/kline_raw.json
          key: kline-raw-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kline-raw-${{ runner.os }}-

      - name: Run Full Update Pipeline
        if: steps.gate.outputs.skip != 'true'
        id: update
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # 定时触发 → 走脚本内部闸门（交易日 + 已收盘），避免盘中/非交易日推不完整数据；
          # 手动触发 → 用 --force 由人为决定是否强制跑。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发 → --force 跳过闸门"
            bash update_data.sh --force
          else
            echo "定时触发 → 交由 update_data.sh 内部闸门校验（交易日 + 已收盘）"
            bash update_data.sh
          fi

      - name: Sync Deploy to Root and Push
        id: sync
        if: steps.gate.outputs.skip != 'true' && success()
        run: |
          set -e
          DEPLOY="deploy"
          if [ ! -d "$DEPLOY" ]; then
            echo "⚠️ $DEPLOY 不存在（可能是 update_data.sh SKIP 了非交易日），跳过推送"
            exit 0
          fi
          echo "deploy/ 内容: $(ls $DEPLOY)"
          # 同步 slim 产出的 deploy/ 到仓库根目录（与 github_pages_deploy.sh Step 3 一致）
          cp "$DEPLOY/index.html" index.html
          cp "$DEPLOY/signals.json" signals.json
          cp "$DEPLOY/lh_calendar.json" lh_calendar.json 2>/dev/null || true
          cp "$DEPLOY/build_manifest.json" build_manifest.json 2>/dev/null || true
          rm -rf output
          cp -R "$DEPLOY/output" output
          touch .nojekyll

          git add -A
          # 逐条 git add -f，不存在的文件容错跳过（gate_data/golden_pool 可能为空）
          for f in index.html signals.json .nojekyll \
            output/top10_history.json output/sector_flow.json output/national_team_etf.json \
            output/golden_diamond.json output/golden_diamond_history.json output/sector_golden_diamond_history.json \
            output/observation_pool.json output/gate_data.json output/report_analysis.json \
            output/golden_pool_meta.json output/golden_pool_manifest.json \
            output/stocks.json \
            output/sh_index_kline.json output/sz_index_kline.json output/cyb_index_kline.json \
            output/kc50_index_kline.json output/hs300_index_kline.json \
            output/market_thermometer.json output/valuation_band.json output/vix_panel.json output/institutional_flow.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          # golden_pool_*.json 可能不存在（空池日）
          ls output/golden_pool_*.json 2>/dev/null | while read f; do git add -f "$f"; done
          # 重要事件日历（按月缓存，fetch_event_calendar.py 产出）
          ls output/event_calendar_*.json 2>/dev/null | while read f; do git add -f "$f"; done

          if git diff --cached --quiet; then
            echo "无更改，跳过推送"
          else
            git commit -m "数据更新: $(date '+%Y-%m-%d %H:%M') (GitHub Actions)"
            # 防冲突：本机 launchd 兜底 / 其它 workflow 可能在此期间推过提交。
            # ⚠️ 原 `git pull --rebase origin main || true` 会静默吞掉 rebase 失败
            #    （8/31 17:14 / 19:14 / 20:24 连续 3 次就是这样挂的，无告警）。
            #    改为失败则 abort + 退避重试，最多 3 次。
            for i in 1 2 3; do
              if git pull --rebase origin main; then break; fi
              echo "⚠️ rebase 失败（第 $i 次），abort 后退避重试"
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
            git push origin main
            echo "✅ 主站已推送"
          fi

      - name: Deploy CloudBase
        if: steps.gate.outputs.skip != 'true' && success()
        env:
          CLOUDBASE_ENV_ID: golden-diamond-observer-d805c7e7
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: |
          npm install -g @cloudbase/cli
          if [ -z "$CLOUDBASE_API_KEY" ]; then
            echo "⚠️ CLOUDBASE_API_KEY 未配置，跳过 CloudBase"
            exit 0
          fi
          if [ ! -d "diamond_site" ]; then
            echo "⚠️ diamond_site/ 不存在，跳过 CloudBase 部署"
            exit 0
          fi
          tcb login --cloudbase-api-key "$CLOUDBASE_API_KEY" -e "$CLOUDBASE_ENV_ID"
          bash cloudbase/deploy_cloudbase.sh