name: Daily Golden Stock Update
on:
  schedule:
    # 每交易日 17:45 北京时间 = 09:45 UTC（周一~五）
    # 注：16:35 龙虎榜数据尚未出炉 → 统一延迟到 17:45
    - cron: '45 9 * * 1-5'
  workflow_dispatch:  # 手动触发按钮（用于首次测试）

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6小时（GitHub Actions 免费版上限）
    permissions:
      contents: write   # 允许 git push

    # ⚠️ market_calendar.py 用 datetime.now() 假定本地 Asia/Shanghai
    # runner 是 UTC，必须设 TZ 才能让交易日+收盘判断正确
    # 云端 LIMIT=800（与本机一致，金钻票池不漏扫联创光电等）
    env:
      TZ: Asia/Shanghai
      PYTHON: python
      LIMIT: '800'
      # 研报数据源（知识星球 api.zsxq.com）。在仓库 Settings→Secrets 配置 ZSXQ_ACCESS_TOKEN。
      # 未配置时 report_analysis.py 会保留本机已推的研报数据、不覆盖、不中断主流程。
      ZSXQ_ACCESS_TOKEN: ${{ secrets.ZSXQ_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install pandas numpy requests akshare

      - name: Verify API Reachability
        run: |
          echo "K线接口:" && curl -sL -o /dev/null -w "%{http_code}" "https://proxy.finance.qq.com/ifzqgtimg/appstock/app/fqkline/get?p=1&param=sh600519,day,,,5,qfq"
          echo ""
          echo "成交额接口:" && curl -sL -o /dev/null -w "%{http_code}" "https://qt.gtimg.cn/q=sh600519,sz000858"
          echo ""
          echo "时区确认:"
          date '+%Z %Y-%m-%d %H:%M:%S'

      - name: Restore Kline Cache
        uses: actions/cache@v4
        id: kline-cache
        with:
          path: output/kline_raw.json
          key: kline-raw-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kline-raw-${{ runner.os }}-

      - name: Run Full Update Pipeline
        id: update
        run: |
          set -e
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # 用 --force 跳过闸门判断，让手动触发也能跑（GitHub UI 可能在白天手动测）。
          # 定时触发 (cron) 自动在 16:35 BJT 触发时，update_data.sh 内部闸门会放行。
          bash update_data.sh --force

      - name: Sync Deploy to Root and Push
        id: sync
        if: success()
        run: |
          set -e
          DEPLOY="deploy"
          if [ ! -d "$DEPLOY" ]; then
            echo "⚠️ $DEPLOY 不存在（可能是 update_data.sh SKIP 了非交易日），跳过推送"
            exit 0
          fi
          echo "deploy/ 内容: $(ls $DEPLOY)"
          # 同步 slim 产出的 deploy/ 到仓库根目录（与 github_pages_deploy.sh Step 3 一致）
          cp "$DEPLOY/index.html" index.html
          cp "$DEPLOY/signals.json" signals.json
          cp "$DEPLOY/lh_calendar.json" lh_calendar.json 2>/dev/null || true
          cp "$DEPLOY/build_manifest.json" build_manifest.json 2>/dev/null || true
          rm -rf output
          cp -R "$DEPLOY/output" output
          touch .nojekyll

          git add -A
          # 逐条 git add -f，不存在的文件容错跳过（gate_data/golden_pool 可能为空）
          for f in index.html signals.json .nojekyll \
            output/top10_history.json output/sector_flow.json output/national_team_etf.json \
            output/golden_diamond.json output/golden_diamond_history.json output/sector_golden_diamond_history.json \
            output/observation_pool.json output/gate_data.json output/report_analysis.json \
            output/golden_pool_meta.json output/golden_pool_manifest.json \
            output/stocks.json \
            output/sh_index_kline.json output/sz_index_kline.json output/cyb_index_kline.json \
            output/kc50_index_kline.json output/hs300_index_kline.json; do
            [ -f "$f" ] && git add -f "$f" || true
          done
          # golden_pool_*.json 可能不存在（空池日）
          ls output/golden_pool_*.json 2>/dev/null | while read f; do git add -f "$f"; done

          if git diff --cached --quiet; then
            echo "无更改，跳过推送"
          else
            git commit -m "数据更新: $(date '+%Y-%m-%d %H:%M') (GitHub Actions)"
            git push origin main
            echo "✅ 主站已推送"
          fi

      - name: Deploy CloudBase
        if: success()
        env:
          CLOUDBASE_ENV_ID: golden-diamond-observer-d805c7e7
          CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
        run: |
          npm install -g @cloudbase/cli
          if [ -z "$CLOUDBASE_API_KEY" ]; then
            echo "⚠️ CLOUDBASE_API_KEY 未配置，跳过 CloudBase"
            exit 0
          fi
          if [ ! -d "diamond_site" ]; then
            echo "⚠️ diamond_site/ 不存在，跳过 CloudBase 部署"
            exit 0
          fi
          tcb login --cloudbase-api-key "$CLOUDBASE_API_KEY" -e "$CLOUDBASE_ENV_ID"
          bash cloudbase/deploy_cloudbase.sh