name: 回购隐含收益 · 每日更新

# ⏸️ 已暂停（2026-07-21）：用户决定停止回购自动更新，数据冻结于 2026-07-20。
# 代码已封存、未删除，后续解决方案待定。恢复时只需把下方 schedule 注释取消即可。
on:
  # schedule:
  #   # 北京 20:00 = UTC 12:00（每日 20:00 抓取前一日 20:00 → 当日 20:00 区间）
  #   - cron: '0 12 * * *'
  workflow_dispatch:   # 仅保留手动触发，便于将来恢复时测试

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 🔴 2026-11-25：密钥必须在作业环境里，供 ci_restage.sh 的 --sync-root / --verify-key 使用
      DDB_DATA_KEY: ${{ secrets.DDB_DATA_KEY }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests cryptography && python -c "import cryptography; print('cryptography', cryptography.__version__)"

      - name: 运行每日更新脚本
        working-directory: repurchase-yield
        run: python update_repurchase.py

      - name: 提交并推送（仅当有变更）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f repurchase-yield/index.html repurchase-yield/records.json repurchase-yield/update_repurchase.py
          if git diff --cached --quiet; then
            echo "无新数据，跳过提交"
          else
            python tool/protect_assets.py --encrypt --purge
            bash tool/ci_restage.sh
            git commit -m "chore: 回购隐含收益每日更新 $(date +%F)"
            # 防冲突：本机兜底/其它 workflow 并发提交时避免 push 失败
            for i in 1 2 3; do
              if git pull --rebase origin main; then break; fi
              echo "⚠️ rebase 失败（第 $i 次），abort 后退避重试"
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
            git push
            echo "已推送更新"
          fi
